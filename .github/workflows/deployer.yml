# Vérifie puis construit l'appli et la publie sur GitHub Pages à chaque push sur main.
# Sur les autres branches et les pull requests : vérifications seulement.
name: Vérifier et déployer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Types, règles du code (oxlint) et tests (Vitest)
      - run: npm run verifier
      # Scripts SQL et règles de sécurité, sur un PostgreSQL jetable
      - run: bash supabase/tests/lancer.sh

  construire:
    needs: verifier
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          # L'appli est servie dans un sous-dossier : https://<compte>.github.io/<dépôt>/
          CHEMIN_BASE: /${{ github.event.repository.name }}/
          ADRESSE_SITE: ${{ steps.pages.outputs.base_url }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
